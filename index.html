<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض المناحل</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto 20px;
    }
    .admin-btn {
      background: #e67e22;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background: #fff;
    }
    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(231, 76, 60, 0.9);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin-top: 0; }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .modal-content button {
      width: 100%;
      padding: 10px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>معرض صور المناحل</h2>
    <button class="admin-btn" onclick="openAdminModal()">إدارة المنحل 🍯</button>
  </div>

  <div class="gallery" id="gallery">
    <p>جاري تحميل الصور...</p>
  </div>

  <!-- نافذة تسجيل الدخول -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3>تسجيل دخول الأدمن</h3>
      <input type="text" id="username" placeholder="اسم المستخدم">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button onclick="login()">دخول</button>
    </div>
  </div>

  <!-- نافذة لوحة التحكم بالرفع -->
  <div class="modal" id="adminPanelModal">
    <div class="modal-content">
      <h3>إدارة الصور</h3>
      <p>اختيار صورة لرفعها للمعرض:</p>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <button onclick="uploadImages()">رفع الصور</button>
      <button onclick="logout()" style="background:#7f8c8d; margin-top:10px;">خروج</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2Fk2jZ6MEzCCVx_zoYlRsR6c3HnbL0ZUEYobGrsvfskIojp2TfFCuJWu0m3A0iNeQ/exec";
    let currentUser = "";
    let currentPass = "";

    // جلب الصور عند فتح الصفحة
    async function loadImages() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        const gallery = document.getElementById("gallery");
        gallery.innerHTML = "";

        if (data.images && data.images.length > 0) {
          data.images.forEach(img => {
            const item = document.createElement("div");
            item.className = "gallery-item";
            let deleteBtn = "";
            
            if (currentUser && currentPass) {
              deleteBtn = `<button class="delete-btn" onclick="deleteImage('${img.id}')">✕</button>`;
            }

            item.innerHTML = `
              <img src="${img.url}" alt="صورة المنحل">
              ${deleteBtn}
            `;
            gallery.appendChild(item);
          });
        } else {
          gallery.innerHTML = "<p>لا توجد صور حالياً في المعرض.</p>";
        }
      } catch (err) {
        alert("حدث خطأ أثناء تحميل الصور");
      }
    }

    function openAdminModal() {
      if (currentUser && currentPass) {
        document.getElementById("adminPanelModal").style.display = "flex";
      } else {
        document.getElementById("loginModal").style.display = "flex";
      }
    }

    async function login() {
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;

      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", username: u, password: p })
      });
      const result = await res.json();

      if (result.status === "success") {
        currentUser = u;
        currentPass = p;
        document.getElementById("loginModal").style.display = "none";
        document.getElementById("adminPanelModal").style.display = "flex";
        loadImages();
      } else {
        alert("بيانات الدخول غير صحيحة!");
      }
    }

    function logout() {
      currentUser = "";
      currentPass = "";
      document.getElementById("adminPanelModal").style.display = "none";
      loadImages();
    }

    async function uploadImages() {
      const files = document.getElementById("fileInput").files;
      if (files.length === 0) return alert("يرجى اختيار صورة أولاً");

      for (let file of files) {
        const reader = new FileReader();
        reader.onload = async function(e) {
          const base64 = e.target.result.split(',')[1];
          await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "upload",
              username: currentUser,
              password: currentPass,
              fileName: file.name,
              mimeType: file.type,
              base64: base64
            })
          });
          loadImages();
        };
        reader.readAsDataURL(file);
      }
      alert("تمت عملية الرفع بنجاح!");
    }

    async function deleteImage(id) {
      if (!confirm("هل أنت تأكد من حذف هذه الصورة؟")) return;

      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "delete",
          username: currentUser,
          password: currentPass,
          id: id
        })
      });
      const result = await res.json();

      if (result.status === "success") {
        loadImages();
      } else {
        alert("فشل الحذف!");
      }
    }

    // تحميل الصور عند البداية
    loadImages();
  </script>
</body>
</html>
